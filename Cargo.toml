[package]
name = "catchback"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_7"] }
ashpd = { version = "0.13.13", default-features = false, features = ["screencast", "async-io"] }
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "clock"] }
futures-util = "0.3.34"
gstreamer = "0.25.4"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
