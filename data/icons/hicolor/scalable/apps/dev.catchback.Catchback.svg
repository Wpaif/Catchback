<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Catchback</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ddcb8"/>
      <stop offset="1" stop-color="#0f7d6c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="rec" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#ff8a80"/>
      <stop offset="0.55" stop-color="#ff3d3d"/>
      <stop offset="1" stop-color="#c4161c"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- fundo -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="56" rx="28" fill="url(#shine)"/>

  <!-- seta de replay (↺): arco anti-horário de 300° com a ponta no alto à esquerda,
       apontando para dentro da abertura -->
  <g filter="url(#soft)">
    <path d="M 34.1 72 A 31 31 0 1 0 42.1 42.1" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <path d="M 49.2 49.2 L 35 35 L 32.9 51.3 Z" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- ponto de gravação -->
  <circle cx="64" cy="64" r="12.5" fill="url(#rec)" filter="url(#soft)"/>
  <circle cx="59.5" cy="59.5" r="3.4" fill="#ffffff" fill-opacity="0.55"/>
</svg>
